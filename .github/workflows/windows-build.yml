name: Windows portable build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build portable application
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: Diffasaurus-Windows-x64
          path: release/Diffasaurus-*-Windows-x64.zip
          if-no-files-found: error
