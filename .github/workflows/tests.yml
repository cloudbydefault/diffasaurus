name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install headless Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0
      - name: Install
        run: python -m pip install .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_unittests_isolated.py
